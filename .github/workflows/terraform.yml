
name: Terraform AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149935825228:role/GitHubActions-ECS-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsSession

      # Step 3: Verify AWS Identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # Step 4: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Step 5: Terraform Format Check
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 6: Terraform Initialize
      - name: Terraform Init
        run: terraform init

      # Step 7: Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # Step 8: Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 9: Terraform Apply
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
