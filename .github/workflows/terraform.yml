
name: Terraform AWS ECS Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149935825228:role/GitHubActions-ECS-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsSession
          role-skip-session-tagging: true

      # 3. Verify AWS connection
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # 5. Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # 6. Terraform initialization
      - name: Terraform Init
        run: terraform init

      # 7. Terraform validation
      - name: Terraform Validate
        run: terraform validate

      # 8. Terraform plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 9. Terraform apply (manual execution only)
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
